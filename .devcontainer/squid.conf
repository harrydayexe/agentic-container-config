# Egress policy for the agentic container.
#
# This is the ONLY route to the internet: iptables DROPs all outbound traffic
# except from the `proxy` uid that Squid drops to. Everything the agent runs
# reaches the network through 127.0.0.1:3128 or not at all, so the allowlist
# below is the complete set of hosts an agent can talk to.

http_port 127.0.0.1:3128

cache_effective_user proxy
cache_effective_group proxy

# --- Allowlist --------------------------------------------------------------
# A leading dot matches the domain itself and every subdomain.
acl allowed_domains dstdomain \
  .golang.org \
  .go.dev \
  .github.com \
  .githubusercontent.com \
  .npmjs.org \
  .npmjs.com \
  .ocaml.org \
  .anthropic.com \
  .claude.ai \
  .claude.com \
  storage.googleapis.com \
  dl.google.com

# --- Method / port policy ---------------------------------------------------
acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT    method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager

http_access allow allowed_domains
http_access deny all

# --- Behaviour --------------------------------------------------------------
# No disk cache; a small memory cache is enough and keeps the volume clean.
cache deny all
cache_mem 64 MB

# Don't advertise the proxy to upstreams.
via off
forwarded_for delete

# Every request the agent makes, on one line each. This is the audit trail.
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

shutdown_lifetime 5 seconds
